@if (isOpen) {
<div class="modal-backdrop" (click)="close()" role="presentation">
  <div class="modal-sheet" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="transModalTitle" appBottomSheet (dismiss)="close()">
    <!-- iOS Drag Handle for Bottom Sheet -->
    <div class="sheet-drag-handle-zone" aria-hidden="true" title="Desliza hacia abajo para cerrar o toca para expandir">
      <div class="sheet-drag-handle"></div>
    </div>

    <div class="sheet-header">
      <div class="sh-title-group">
        <span class="sh-badge-pill">Traspaso Interno</span>
        <h3 id="transModalTitle" class="sheet-title">Transferencia Entre Cuentas</h3>
      </div>
      <button type="button" class="sheet-close-btn" (click)="close()" title="Cerrar (Esc)" aria-label="Cerrar">✕</button>
    </div>

    @if (errorMessage()) {
      <div class="modal-error-banner" role="alert">
        <span class="meb-icon">⚠️</span>
        <span class="meb-text">{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="transferForm" (ngSubmit)="submit()" class="sheet-form">
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="fromAccount">Cuenta Origen *</label>
          <select id="fromAccount" class="form-input" formControlName="fromAccountId">
            @for (acc of barberService.financialAccounts(); track acc.id) {
            <option [value]="acc.id">{{ acc.name }} ({{ barberService.currencySymbol() }}{{ acc.currentBalance.toFixed(2) }})</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="toAccount">Cuenta Destino *</label>
          <select id="toAccount" class="form-input" formControlName="toAccountId">
            @for (acc of barberService.financialAccounts(); track acc.id) {
            <option [value]="acc.id">{{ acc.name }} ({{ barberService.currencySymbol() }}{{ acc.currentBalance.toFixed(2) }})</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="transAmount">Monto a Transferir ({{ barberService.currencySymbol() }}) *</label>
        <div class="input-prefix-wrapper">
          <span class="input-prefix">{{ barberService.currencySymbol() }}</span>
          <input
            id="transAmount"
            type="number"
            step="0.50"
            min="0.50"
            class="form-input with-prefix"
            formControlName="amount"
            placeholder="0.00"
            autofocus />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="transDesc">Nota / Justificación</label>
        <input
          id="transDesc"
          type="text"
          class="form-input"
          formControlName="description"
          placeholder="Ej: Depósito bancario de recaudación del día" />
      </div>

      <div class="sheet-footer">
        <button type="button" class="btn-secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="btn-primary-action" [disabled]="transferForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Transfiriendo...' : 'Confirmar Transferencia' }}
        </button>
      </div>
    </form>
  </div>
</div>
}
