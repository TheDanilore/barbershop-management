@if (isOpen) {
<div class="modal-backdrop" (click)="close()" role="presentation">
  <div class="modal-sheet" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="serviceModalTitle" appBottomSheet (dismiss)="close()">
    <!-- iOS Drag Handle for Bottom Sheet -->
    <div class="sheet-drag-handle-zone" aria-hidden="true" title="Desliza hacia abajo para cerrar o toca para expandir">
      <div class="sheet-drag-handle"></div>
    </div>

    <div class="sheet-header">
      <div class="sheet-title-group">
        <span class="sheet-badge gold">Catálogo</span>
        <h3 id="serviceModalTitle" class="sheet-title">{{ serviceToEdit ? 'Editar Servicio' : 'Nuevo Servicio' }}</h3>
      </div>
      <button type="button" class="sheet-close-btn" (click)="close()" title="Cerrar (Esc)" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    @if (errorMessage()) {
      <div class="modal-error-banner" role="alert">
        <span class="meb-icon">⚠️</span>
        <span class="meb-text">{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="serviceForm" (ngSubmit)="submit()" class="sheet-form">
      <div class="form-group">
        <label class="form-label" for="serviceName">Nombre del Servicio *</label>
        <input id="serviceName" type="text" class="form-input" formControlName="name" placeholder="Ej: Corte Clásico + Barba" autofocus />
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="servicePrice">Precio ({{ barberService.currencySymbol() }}) *</label>
          <input id="servicePrice" type="number" step="0.50" min="0.5" class="form-input" formControlName="price" />
        </div>

        <div class="form-group">
          <label class="form-label" for="serviceDuration">Duración (min) *</label>
          <input id="serviceDuration" type="number" step="5" min="5" class="form-input" formControlName="durationMinutes" />
        </div>
      </div>

      <div class="sheet-footer">
        <button type="button" class="btn-secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="btn-primary-action" [disabled]="serviceForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Guardando...' : serviceToEdit ? 'Guardar Cambios' : 'Crear Servicio' }}
        </button>
      </div>
    </form>
  </div>
</div>
}
